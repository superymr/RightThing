[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rightthing"
version = "0.1.0"
description = "RightThing 正事：基于真实岗位的职业方向与技能缺口分析"
requires-python = ">=3.10"
# M1 核心链路零第三方依赖：仅用标准库即可跑通 analyze 全流程。
dependencies = []

[project.optional-dependencies]
llm = ["httpx>=0.27"]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
rightthing = "app.cli:main"
jobradar = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
